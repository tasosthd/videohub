<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="assets/css/style.css?v=fix-config-2">
<title>Search · VideoHub</title>
</head>
<body data-protected="true">
<div class="app-shell">
<aside class="sidebar">
  <div class="sidebar-inner">
    <a class="logo" href="index.html" aria-label="VideoHub home"><span class="logo-mark">V</span><span>VideoHub</span></a>
    <nav class="nav" aria-label="Primary navigation">
      <a class="" href="index.html"><span>⌂</span> Home</a>
      <a class="active" href="search.html"><span>⌕</span> Search</a>
      <a class="" href="upload.html"><span>＋</span> Upload</a>
      <a class="" href="profile.html"><span>◎</span> Profile</a>
    </nav>
    <div class="side-card">
      <a class="profile-mini" data-profile-button href="profile.html">
        <img class="avatar" data-avatar alt="">
        <span><strong data-profile-name>Creator</strong><small data-profile-subtitle>Channel dashboard</small></span>
      </a>
      <a class="btn btn-primary btn-small full" href="upload.html">Publish</a>
      <button class="btn btn-danger btn-small full" data-action="logout">Logout</button>
    </div>
  </div>
</aside>
<main class="main">
  <header class="topbar"><div><p class="eyebrow">Discovery engine</p><h1>Search</h1><p class="subtle">Find videos by title, description, creator username, full name, and category.</p></div></header>
  <section class="card card-pad grid">
    <form id="searchForm" class="search-row">
      <input id="searchInput" class="input" placeholder="Search titles, descriptions, or usernames" autocomplete="off">
      <select id="searchCategory"><option>All</option><option>Business</option><option>Gaming</option><option>Education</option><option>Lifestyle</option><option>Tech</option><option>Sports</option><option>Music</option></select>
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
    <div id="searchMeta" class="subtle small"></div>
    <div class="video-grid" id="searchResults" aria-live="polite"></div>
  </section>
</main>
</div>
<nav class="mobile-nav" aria-label="Mobile navigation">
  <a class="" href="index.html">Home</a>
  <a class="active" href="search.html">Search</a>
  <a class="" href="upload.html">Upload</a>
  <a class="" href="profile.html">Profile</a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js?v=fix-config-2"></script>
<script src="assets/js/auth.js?v=fix-config-2"></script>
<script src="assets/js/app.js?v=fix-config-2"></script>
<script src="assets/js/search.js?v=fix-config-2"></script>
</body>
</html>
