<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · VideoHub</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="auth-page">
  <main class="auth-card">
    <a class="logo" href="index.html"><span class="logo-mark">V</span><span>VideoHub</span></a>
    <h1>Log in and keep building.</h1><p>Access your creator dashboard, uploads, saves, comments, and feed.</p>
    <form id="loginForm" class="form-grid">
      <label class="field"><span>Email</span><input id="email" class="input" type="email" autocomplete="email" required></label>
      <label class="field"><span>Password</span><input id="password" class="input" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="auth-switch">No account? <a href="signup.html">Create one</a></p>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/auth.js"></script></body></html>
