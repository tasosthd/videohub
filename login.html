<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="assets/css/style.css?v=fix-config-2">
<title>Login · VideoHub</title>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="logo" href="index.html"><span class="logo-mark">V</span><span>VideoHub</span></a>
    <p class="eyebrow">Creator access</p>
    <h1>Log in and keep building.</h1>
    <p>Access uploads, saves, comments, profile controls, and the creator feed.</p>
    <form id="loginForm" class="form-grid">
      <label class="field"><span>Email</span><input id="email" class="input" type="email" autocomplete="email" required></label>
      <label class="field"><span>Password</span><input id="password" class="input" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary full" type="submit">Log in</button>
    </form>
    <p class="auth-switch">No account? <a href="signup.html">Create one</a></p>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js?v=fix-config-2"></script>
<script src="assets/js/auth.js?v=fix-config-2"></script>
</body>
</html>
